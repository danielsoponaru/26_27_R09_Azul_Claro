# Entorno del proyecto Reto 09 (Azul Claro).
# Crear:    conda env create -f environment.yml
# Activar:  conda activate reto09
# Actualizar tras cambios en este fichero:
#           conda env update -f environment.yml --prune
name: reto09
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Datos y cálculo
  - pandas
  - numpy
  # Gráficos
  - matplotlib
  - seaborn
  - plotly
  # Exportar figuras de plotly a PNG (necesita Chrome o Chromium instalado)
  - python-kaleido
  # Series temporales (descomposición, test ADF)
  - statsmodels
  # Descarga de datos de Yahoo Finance
  - yfinance
  # Notebooks
  - jupyter
  - ipykernel
  - nbconvert
  # Fórmula cerrada de BBVA (scipy) y red neuronal (pytorch; scikit-learn para referencias y métricas)
  - scipy
  - scikit-learn
  - pytorch
# Cuando se implemente la volatilidad (GARCH), añadir aquí arch.
